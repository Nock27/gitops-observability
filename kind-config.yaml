kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # The Master Node (Brain of the cluster)
  - role: control-plane
  # Worker Node 1 (Runs our apps)
  - role: worker
    extraPortMappings:
      # Argo CD UI (localhost:8080 -> Cluster Port 30080)
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Grafana Dashboard (localhost:3000 -> Cluster Port 30000)
      - containerPort: 30000
        hostPort: 3000
        protocol: TCP
      # Sample App (localhost:8000 -> Cluster Port 30081)
      - containerPort: 30081
        hostPort: 8000
        protocol: TCP
  # Worker Node 2 (Runs monitoring stack)
  - role: worker
